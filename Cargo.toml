[package]
name = "momentumd"
version = "0.1.0"
edition = "2021"
authors = ["Jazden"]
license = "MIT"
description = "Ultra-fast persistent connection daemon and CLI for Sennheiser Momentum headphones on Linux"
repository = "https://github.com/Jazden/momentumd"

[[bin]]
name = "momentumd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bluer = { version = "0.17", features = ["bluetoothd", "rfcomm"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
